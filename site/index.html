<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HerdIQ · Device Registry</title>
  <meta name="description" content="Scan a HerdIQ CattleBand to see the device and the animal it is fitted to.">
  <meta name="theme-color" content="#1f6b4a">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/serial.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/scanner.js" defer></script>
  <script src="assets/js/home.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <img src="assets/img/icon.svg" alt="" width="32" height="32">
      <span class="brand__name">HerdIQ</span>
      <span class="brand__sub">Device registry</span>
    </a>
  </header>

  <main class="container">
    <div class="banner" id="test-banner" hidden>
      <strong>Test data.</strong> Animal details shown here are placeholders until the bands are deployed.
    </div>

    <section class="card card--hero" aria-labelledby="scan-title">
      <h1 id="scan-title" class="hero__title">Scan a CattleBand</h1>
      <p class="hero__text">Point your phone camera at the barcode on the band.</p>
      <button type="button" class="btn btn--primary btn--xl" id="scan-btn">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 5a2 2 0 0 1 2-2h3v2H5v3H3V5Zm13-2h3a2 2 0 0 1 2 2v3h-2V5h-3V3ZM3 16h2v3h3v2H5a2 2 0 0 1-2-2v-3Zm16 0h2v3a2 2 0 0 1-2 2h-3v-2h3v-3ZM6 7h1.5v10H6V7Zm2.5 0h1v10h-1V7Zm2 0H13v10h-2.5V7Zm3.5 0h1v10h-1V7Zm2 0h2v10h-2V7Z"/></svg>
        Scan barcode
      </button>

      <div class="divider"><span>or type the serial</span></div>

      <form class="serial-form" id="serial-form" novalidate>
        <label class="visually-hidden" for="serial-input">Serial number</label>
        <input class="input input--mono" id="serial-input" name="serial" type="text"
               inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
               placeholder="S1HCB0321 or 321" maxlength="40">
        <button type="submit" class="btn btn--secondary">Open</button>
      </form>
      <p class="form-error" id="serial-error" role="alert" hidden></p>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title" class="section-title">Devices <span class="count" id="device-count"></span></h2>
        <label class="visually-hidden" for="filter-input">Search devices</label>
        <input class="input input--search" id="filter-input" type="search" placeholder="Search serial, animal, tag…" autocomplete="off">
      </div>
      <div id="device-list" class="device-list" aria-live="polite">
        <p class="muted">Loading devices…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>HerdIQ · Vayam Designers</span>
    <a href="labels/">Label printing tool</a>
  </footer>

  <!-- Full-screen camera scanner -->
  <div class="scanner" id="scanner" role="dialog" aria-modal="true" aria-label="Barcode scanner" hidden>
    <video class="scanner__video" id="scanner-video" playsinline muted></video>
    <div class="scanner__mask">
      <div class="scanner__guide" id="scanner-guide"><span class="scanner__laser"></span></div>
    </div>
    <div class="scanner__top">
      <button type="button" class="icon-btn" id="scanner-close" aria-label="Close scanner">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3 1.4 1.4Z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="scanner-torch" aria-label="Toggle flashlight" aria-pressed="false" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 2h10v4l-3 4v12h-4V10L7 6V2Zm2 2v1.3l3 4 3-4V4H9Z"/></svg>
      </button>
    </div>
    <div class="scanner__bottom">
      <p class="scanner__hint" id="scanner-hint">Starting camera…</p>
      <div class="scanner__error" id="scanner-error" hidden>
        <p id="scanner-error-text"></p>
        <div class="scanner__actions">
          <button type="button" class="btn btn--primary" id="scanner-retry">Try again</button>
          <button type="button" class="btn btn--ghost" id="scanner-type">Type serial</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
